name: Generate Application Release Asset

on:
  push:
    tags:
      - 'v*' # Triggers instantly whenever you push a version tag (e.g., v0.1.0)
  workflow_dispatch: # Allows you to manually trigger this build via the GitHub website

permissions:
  contents: write # Mandatory permission allowing the runner to publish the release and upload files

jobs:
  validate_and_compile:
    runs-on: macos-13 # Forces Intel x86_64 cloud machine runner for native compilation pipelines

    steps:
    # 1. Check out the repository source code tree
    - name: Checkout OPLC-Plus Repository
      uses: actions/checkout@v4

    # 2. Initialize the Python execution environment
    - name: Set up Python Runtime (3.11)
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # 3. Check Python scripts for syntax errors using your exact folder layout path
    - name: Lint and Validate Python Core Logic
      run: |
        python3 -m py_compile oplc_plus/scr/os_data.py

    # 4. Install the official Intel ACPI Compiler (iasl) tool utilities
    - name: Install Intel ACPI Compiler Tools (iasl)
      run: |
        brew update
        brew install iasl

    # 5. Build workspaces and compile the Snapdragon ASL code to a binary AML table
    - name: Compile Universal Snapdragon Emulation ACPI Table
      run: |
        mkdir -p dist/acpi
        if [ -f "oplc_plus/src/target_snapdragon/SSDT-OPLC-SNAP.asl" ]; then
          iasl -sa -p dist/acpi/SSDT-OPLC-SNAP oplc_plus/src/target_snapdragon/SSDT-OPLC-SNAP.asl
        elif [ -f "oplc_plus/scr/target_snapdragon/SSDT-OPLC-SNAP.asl" ]; then
          iasl -sa -p dist/acpi/SSDT-OPLC-SNAP oplc_plus/scr/target_snapdragon/SSDT-OPLC-SNAP.asl
        else
          echo "[!] Skipping ASL compilation: Source file not found."
        fi

    # 6. Execute Application Compilation Setup
    - name: Run Build Action Script
      run: |
        if [ -f ".github/actions/build_app.sh" ]; then
          chmod +x .github/actions/build_app.sh
          ./.github/actions/build_app.sh
        else
          echo "[!] Creating emergency fallback workspace for packaging..."
          mkdir -p dist/OPLC-Plus.app/Contents/MacOS
          mkdir -p dist/OPLC-Plus.app/Contents/Resources
          cp -R oplc_plus dist/OPLC-Plus.app/Contents/Resources/
          echo -e '#!/bin/bash\npython3 "$(dirname "$0")/../Resources/oplc_plus/scr/os_data.py"' > dist/OPLC-Plus.app/Contents/MacOS/OPLC-Plus
          chmod +x dist/OPLC-Plus.app/Contents/MacOS/OPLC-Plus
          cd dist && zip -r "../OPLC-Plus.app.zip" "OPLC-Plus.app"
        fi

    # 7. Automate creating the official GitHub release page and append the binary asset download link
    - name: Create Release and Upload Zip Asset
      uses: softprops/action-gh-release@v2
      with:
        name: "OPLC-Plus Beta 1 (${{ github.ref_name }}) - macOS 27 Patcher"
        body: |
          # OPLC-Plus Release Milestone (Intel Tier-1 Launch)

          Welcome to the initial release of **OPLC-Plus**, an experimental developer-focused framework targeting **macOS 27 Golden Gate** compatibility across legacy Intel hardware and Snapdragon ARM laptops.

          _Download the application bundle attached below, unzip, and clear gatekeeper quarantine configurations (`xattr -cr /Applications/OPLC-Plus.app`) before launching._
        files: ./OPLC-Plus.app.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

