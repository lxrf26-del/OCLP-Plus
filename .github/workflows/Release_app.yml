name: Generate Application Release Asset

on:
  push:
    tags:
      - 'v*' # Triggers instantly whenever you push a version tag (e.g., v0.1.0)
  workflow_dispatch: # Allows you to manually click a "Run workflow" test button on the web interface

permissions:
  contents: write # Grants the cloud runner native permissions to compile, pack, and post releases

jobs:
  build_and_release:
    runs-on: macos-13 # Ensures a pure Intel x86_64 Mac runner environment for native kext builds

    steps:
    # 1. Fetch your current repository files
    - name: Checkout OPLC-Plus Repository
      uses: actions/checkout@v4

    # 2. Start Python 3.11 Environment
    - name: Set up Python Runtime (3.11)
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # 3. Dynamic Python Finder Step (Finds the script regardless of typo folders)
    - name: Lint and Validate Python Core Logic
      run: |
        echo "[*] Dynamically tracking down os_data.py files in current workspace..."
        TARGET_FILE=$(find . -name "os_data.py" | head -n 1)
        if [ -n "$TARGET_FILE" ]; then
          echo "[+] Core target script discovered at: $TARGET_FILE"
          python3 -m py_compile "$TARGET_FILE"
        else
          echo "[-] Error: Core script os_data.py could not be found anywhere in this repository!"
          exit 1
        fi

    # 4. Automatic Workspace Bundler Action
    - name: Assemble Application Bundle Packages
      run: |
        echo "[*] Packaging clean application bundle file matrices..."
        mkdir -p dist/OPLC-Plus.app/Contents/MacOS
        mkdir -p dist/OPLC-Plus.app/Contents/Resources
        
        # Identify your package root directory folder dynamically
        PACKAGE_ROOT=$(find . -name "os_data.py" | head -n 1 | cut -d'/' -f2)
        echo "[+] Identified internal package root path directory as: $PACKAGE_ROOT"
        
        # Safely stage package resources inside the application bundle structure
        cp -R "$PACKAGE_ROOT" dist/OPLC-Plus.app/Contents/Resources/
        
        # Generate the main binary launcher script entrypoint pointing to your file dynamically
        echo "#!/bin/bash" > dist/OPLC-Plus.app/Contents/MacOS/OPLC-Plus
        echo 'python3 "$(dirname "$0")/../Resources/'"$PACKAGE_ROOT"'/scr/shared/os_data.py"' >> dist/OPLC-Plus.app/Contents/MacOS/OPLC-Plus
        chmod +x dist/OPLC-Plus.app/Contents/MacOS/OPLC-Plus
        
        # Zip the bundle for release output distribution
        cd dist && zip -r "../OPLC-Plus.app.zip" "OPLC-Plus.app"

    # 5. Native GitHub CLI Release Automation
    - name: Deploy Binary Release to GitHub via CLI
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        TAG_NAME="${{ github.ref_name }}"
        # If running manually via the dispatch button instead of a tag, provide a fallback tag string
        if [ "$TAG_NAME" == "main" ] || [ "$TAG_NAME" == "master" ]; then
          TAG_NAME="v0.1.0-manual-build"
        fi
        
        echo "[*] Deploying native GitHub Release for tag: $TAG_NAME"
        
        # Deletes an existing release tracking configuration point if it already exists to overwrite it cleanly
        gh release delete "$TAG_NAME" --y || true
        
        # Creates a fresh release post, generates the notes, and uploads your app asset binary in one step
        gh release create "$TAG_NAME" ./OPLC-Plus.app.zip \
          --title "OPLC-Plus Beta 1 ($TAG_NAME) - macOS 27 Patcher" \
          --notes "Welcome to the initial release of **OPLC-Plus**, an experimental developer-focused framework targeting **macOS 27 Golden Gate** compatibility across legacy Intel hardware and Snapdragon ARM laptops."
